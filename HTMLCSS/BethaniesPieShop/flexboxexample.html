<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .columns{
       border: 1px solid rgba(15, 129, 191, 0.533);
       display: flex;
    }
    .columns > div{
      border: 2px solid #ccc;
      flex: 1;
    }
    .columns >  div:nth-child(2)
    {
      flex: 2;
    }
  </style>
</head>
<body>
  <div class="columns">
    <div>column1</div>
    <div>column2</div>
    <div>column3</div>
  </div>
</body>
</html>
